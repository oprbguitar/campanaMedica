<style>
  :root { color-scheme: light; --ink: #173b39; --muted: #607674; --primary: #0b6b61; --primary-dark: #075047; --surface: #ffffff; --background: #eef7f4; --line: #d5e4e0; --danger: #a53e3e; --warning: #805d18; }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; background: linear-gradient(145deg, #e7f4f0 0%, #f7fbfa 65%); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app-shell { width: min(calc(100% - 24px), 760px); margin: 0 auto; padding: clamp(20px, 4vw, 36px) 0 52px; }
  .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--primary); color: #fff; font-size: 28px; font-weight: 700; }
  .eyebrow, .step-kicker { margin: 0 0 4px; color: var(--primary); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  h1, h2 { margin: 0; letter-spacing: -.02em; }
  h1 { font-size: clamp(21px, 5vw, 28px); }
  h2 { font-size: 26px; }
  .progress { display: flex; align-items: center; margin: 0 0 18px; }
  .progress-step { display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--line); border-radius: 50%; color: var(--muted); font-size: 13px; font-weight: 800; background: #fff; }
  .progress-step.is-active, .progress-step.is-done { border-color: var(--primary); background: var(--primary); color: #fff; }
  .progress-line { flex: 1; height: 2px; background: var(--line); }
  .card { border: 1px solid rgba(213, 228, 224, .9); border-radius: 22px; padding: 24px; background: rgba(255,255,255,.92); box-shadow: 0 14px 36px rgba(19, 65, 59, .08); }
  .muted { margin: 8px 0 22px; color: var(--muted); line-height: 1.5; }
  label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 750; }
  label span { color: var(--muted); font-weight: 500; }
  input, select { width: 100%; min-height: 48px; border: 1px solid #bcd1cc; border-radius: 12px; padding: 10px 13px; color: var(--ink); background: #fff; font: inherit; font-size: 16px; }
  input:focus, select:focus { outline: 3px solid rgba(11,107,97,.18); border-color: var(--primary); }
  .button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; font: inherit; font-weight: 800; letter-spacing: .03em; }
  .button:disabled { cursor: not-allowed; opacity: .52; }
  .button-primary { background: var(--primary); color: #fff; }
  .button-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .button-secondary { border: 1px solid var(--primary); background: #fff; color: var(--primary); }
  .two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .calendar { margin-top: 18px; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: #fbfefd; }
  .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .calendar-toolbar strong { color: var(--ink); font-size: 17px; text-transform: capitalize; }
  .calendar-nav { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--primary); cursor: pointer; font-size: 25px; line-height: 1; }
  .calendar-nav:disabled { cursor: not-allowed; opacity: .35; }
  .calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .calendar-weekdays { margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 800; text-align: center; text-transform: uppercase; }
  .calendar-days { min-height: 228px; }
  .calendar-day, .calendar-empty { min-height: 36px; }
  .calendar-day { border: 1px solid transparent; border-radius: 10px; background: transparent; color: #9aaead; font: inherit; font-weight: 700; }
  .calendar-day:not(:disabled) { border-color: #bcd1cc; background: #fff; color: var(--ink); cursor: pointer; }
  .calendar-day:not(:disabled):hover { border-color: var(--primary); background: #e4f4ef; }
  .calendar-day.is-selected { border: 2px solid var(--primary); background: var(--primary); color: #fff; }
  .selected-date { margin: 14px 0 0; color: var(--primary-dark); font-size: 14px; font-weight: 750; }
  .slot-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  .slot-button { min-height: 56px; border: 1px solid #bcd1cc; border-radius: 12px; background: #fff; color: var(--ink); cursor: pointer; font: inherit; font-weight: 700; }
  .slot-button.is-selected { border: 2px solid var(--primary); background: #e4f4ef; color: var(--primary-dark); }
  .empty { grid-column: 1 / -1; padding: 14px; border-radius: 12px; background: var(--background); color: var(--muted); font-size: 14px; text-align: center; }
  .alert { margin: 0 0 16px; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
  .alert.error { background: #fceaea; color: var(--danger); }
  .alert.warning { background: #fff4d9; color: var(--warning); }
  .loading { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; color: var(--primary); font-size: 14px; }
  .spinner { width: 18px; height: 18px; border: 3px solid #c6e1dc; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  .success-icon { display: grid; place-items: center; width: 54px; height: 54px; margin-bottom: 16px; border-radius: 50%; background: #dff4e9; color: #187243; font-size: 30px; font-weight: 800; }
  .confirmation-box { margin-top: 22px; border-radius: 14px; background: var(--background); padding: 4px 16px; }
  .confirmation-box p { display: flex; justify-content: space-between; gap: 16px; margin: 14px 0; font-size: 14px; }
  .confirmation-box span { color: var(--muted); }
  .confirmation-box strong { text-align: right; }
  .reservation-code { color: var(--primary); letter-spacing: .08em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) { .app-shell { width: min(calc(100% - 20px), 760px); padding-top: 18px; } .card { padding: 18px; } .slot-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; } .slot-button { min-height: 52px; } .calendar { padding: 11px; } .calendar-weekdays, .calendar-days { gap: 4px; } .calendar-day, .calendar-empty { min-height: 40px; } }
  @media (max-width: 390px) { .app-shell { width: calc(100% - 14px); } .two-fields { grid-template-columns: 1fr; gap: 0; } .calendar-day, .calendar-empty { min-height: 36px; } .calendar-weekdays { font-size: 10px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
</style>
