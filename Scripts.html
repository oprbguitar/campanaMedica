<script>
  const state = { step: 1, campaigns: [], selectedCampaignId: '', dates: [], selectedDate: '', calendarMonth: '', selectedSlot: null, loading: false };
  const $ = (selector) => document.querySelector(selector);

  function runServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const allowedFunctions = new Set([
        'getAppConfig',
        'getActiveCampaigns',
        'getBookingCalendar',
        'getCampaignDates',
        'getAvailableSlots',
        'lookupPersonByDni',
        'createReservation',
        'getReservation',
        'cancelReservation'
      ]);
      if (!allowedFunctions.has(functionName)) {
        reject(new Error('Operación no disponible.'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .runServerFunction(functionName, args);
    });
  }

  function showAlert(message, type = 'error') {
    const alert = $('#alert');
    alert.textContent = message;
    alert.className = `alert ${type}`;
    alert.hidden = !message;
  }

  function setLoading(isLoading, message = 'Cargando...') {
    state.loading = isLoading;
    $('#loading-text').textContent = message;
    $('#loading').hidden = !isLoading;
    document.querySelectorAll('button').forEach((element) => { element.disabled = isLoading; });
  }

  function handleResponse(response) {
    if (!response || response.success !== true) {
      const error = new Error(response?.message || 'No pudimos completar la operación.');
      error.code = response?.code || 'INTERNAL_ERROR';
      error.response = response;
      throw error;
    }
    return response;
  }

  function showStep(step) {
    state.step = step;
    document.querySelectorAll('.step').forEach((section) => { section.hidden = Number(section.dataset.step) !== step; });
    document.querySelectorAll('[data-step-indicator]').forEach((indicator) => {
      const indicatorStep = Number(indicator.dataset.stepIndicator);
      indicator.classList.toggle('is-active', indicatorStep === step);
      indicator.classList.toggle('is-done', indicatorStep < step);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function loadCampaigns() {
    setLoading(true, 'Cargando agenda...');
    try {
      const response = handleResponse(await runServer('getBookingCalendar'));
      state.campaigns = response.campaigns || [];
      state.selectedCampaignId = response.campaignId || '';
      state.dates = response.dates || [];
      state.selectedDate = '';
      state.calendarMonth = state.dates.length ? toMonthKey_(state.dates[0]) : currentMonthKey_();
      renderCalendar();
      if (!state.dates.length) $('#slots').innerHTML = '<p class="empty">No hay horarios disponibles.</p>';
    } catch (error) { showAlert(error.message); }
    finally { setLoading(false); }
  }

  async function lookupDni() {
    const dni = $('#dni').value.trim();
    if (!/^\d{8}$/.test(dni)) { showAlert('El DNI debe tener exactamente 8 dígitos.'); return; }
    setLoading(true, 'Consultando tus datos...');
    showAlert('');
    try {
      const response = handleResponse(await runServer('lookupPersonByDni', dni));
      $('#person-note').textContent = response.found ? 'Encontramos tus datos. Confírmalos antes de continuar.' : 'Completa tus nombres y apellidos para continuar.';
      if (response.found) { $('#nombres').value = response.person.nombres || ''; $('#apellidos').value = response.person.apellidos || ''; }
      showStep(2);
      $('#nombres').focus();
    } catch (error) { showAlert(error.message); }
    finally { setLoading(false); }
  }

  async function loadDates() {
    state.selectedSlot = null;
    state.selectedDate = '';
    $('#confirm-reservation').disabled = true;
    const campaignId = state.selectedCampaignId;
    $('#slots').innerHTML = '';
    $('#selected-date').hidden = true;
    if (!campaignId) { state.dates = []; state.calendarMonth = currentMonthKey_(); renderCalendar(); return; }
    setLoading(true, 'Consultando fechas...');
    try {
      const response = handleResponse(await runServer('getCampaignDates', campaignId));
      state.dates = response.dates || [];
      state.calendarMonth = state.dates.length ? toMonthKey_(state.dates[0]) : currentMonthKey_();
      renderCalendar();
      if (!state.dates.length) $('#slots').innerHTML = '<p class="empty">No quedan fechas disponibles.</p>';
    } catch (error) { showAlert(error.message); }
    finally { setLoading(false); }
  }

  function currentMonthKey_() {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Lima', year: 'numeric', month: '2-digit' }).formatToParts(new Date());
    const year = parts.find((part) => part.type === 'year').value;
    const month = parts.find((part) => part.type === 'month').value;
    return `${year}-${month}`;
  }

  function toMonthKey_(dateText) { return dateText.slice(0, 7); }

  function shiftMonth_(monthKey, amount) {
    const [year, month] = monthKey.split('-').map(Number);
    const shifted = new Date(Date.UTC(year, month - 1 + amount, 1));
    return `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth() + 1).padStart(2, '0')}`;
  }

  function formatMonthLabel_(monthKey) {
    return new Intl.DateTimeFormat('es-PE', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(`${monthKey}-01T12:00:00Z`));
  }

  function renderCalendar() {
    const monthKey = state.calendarMonth || currentMonthKey_();
    const [year, month] = monthKey.split('-').map(Number);
    const firstWeekday = (new Date(Date.UTC(year, month - 1, 1)).getUTCDay() + 6) % 7;
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
    const availableDates = new Set(state.dates);
    const days = $('#calendar-days');
    days.textContent = '';
    $('#calendar-month').textContent = formatMonthLabel_(monthKey);
    for (let index = 0; index < firstWeekday; index += 1) days.appendChild(document.createElement('span')).className = 'calendar-empty';
    for (let day = 1; day <= daysInMonth; day += 1) {
      const dateText = `${monthKey}-${String(day).padStart(2, '0')}`;
      const dayButton = document.createElement('button');
      dayButton.type = 'button';
      dayButton.className = 'calendar-day';
      dayButton.textContent = String(day);
      dayButton.disabled = !availableDates.has(dateText);
      dayButton.setAttribute('aria-label', formatDate(dateText));
      dayButton.setAttribute('role', 'gridcell');
      if (dateText === state.selectedDate) dayButton.classList.add('is-selected');
      if (!dayButton.disabled) dayButton.addEventListener('click', () => selectDate(dateText));
      days.appendChild(dayButton);
    }
    const months = [...new Set(state.dates.map(toMonthKey_))].sort();
    const previousDisabled = !months.length || monthKey <= months[0];
    const nextDisabled = !months.length || monthKey >= months[months.length - 1];
    $('#calendar-prev').disabled = previousDisabled;
    $('#calendar-next').disabled = nextDisabled;
  }

  async function selectDate(dateText) {
    state.selectedDate = dateText;
    $('#selected-date').textContent = `Fecha seleccionada: ${formatDate(dateText)}`;
    $('#selected-date').hidden = false;
    renderCalendar();
    await loadSlots();
  }

  function changeCalendarMonth_(amount) {
    state.calendarMonth = shiftMonth_(state.calendarMonth || currentMonthKey_(), amount);
    renderCalendar();
  }

  async function loadSlots() {
    state.selectedSlot = null;
    $('#confirm-reservation').disabled = true;
    const campaignId = state.selectedCampaignId;
    const date = state.selectedDate;
    $('#slots').innerHTML = '';
    if (!campaignId || !date) return;
    setLoading(true, 'Consultando horarios...');
    try {
      const response = handleResponse(await runServer('getAvailableSlots', campaignId, date));
      const slots = response.slots || [];
      if (!slots.length) { $('#slots').innerHTML = '<p class="empty">No quedan horarios disponibles para esta fecha.</p>'; return; }
      slots.forEach((slot) => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'slot-button'; button.textContent = `${slot.start} - ${slot.end}`;
        button.addEventListener('click', () => { document.querySelectorAll('.slot-button').forEach((item) => item.classList.remove('is-selected')); button.classList.add('is-selected'); state.selectedSlot = slot; $('#confirm-reservation').disabled = false; });
        $('#slots').appendChild(button);
      });
    } catch (error) { showAlert(error.message); }
    finally { setLoading(false); }
  }

  async function confirmReservation() {
    if (!state.selectedSlot) { showAlert('Selecciona un horario.'); return; }
    setLoading(true, 'Confirmando tu cita...'); showAlert('');
    const payload = { campaignId: state.selectedCampaignId, slotId: state.selectedSlot.slotId, dni: $('#dni').value.trim(), nombres: $('#nombres').value.trim(), apellidos: $('#apellidos').value.trim(), telefono: $('#telefono').value.trim(), area: $('#area').value.trim() };
    try {
      const response = handleResponse(await runServer('createReservation', payload));
      renderConfirmation(response.reservation); showStep(4);
    } catch (error) {
      const knownConcurrency = error.code === 'HORARIO_OCUPADO';
      showAlert(error.message, knownConcurrency ? 'warning' : 'error');
      if (knownConcurrency) await loadSlots();
    } finally { setLoading(false); }
  }

  function renderConfirmation(reservation) {
    $('#confirmation-name').textContent = reservation.name;
    $('#confirmation-date').textContent = formatDate(reservation.date);
    $('#confirmation-time').textContent = reservation.time;
    $('#confirmation-code').textContent = reservation.reservationCode;
  }

  function formatDate(dateText) {
    const [year, month, day] = dateText.split('-');
    return `${day}/${month}/${year}`;
  }

  function validatePersonStep() {
    if (!$('#nombres').value.trim() || !$('#apellidos').value.trim()) { showAlert('Ingresa nombres y apellidos para continuar.'); return false; }
    return true;
  }

  function resetForm() {
    ['dni', 'nombres', 'apellidos', 'telefono', 'area'].forEach((id) => { $(`#${id}`).value = ''; });
    state.selectedCampaignId = ''; state.selectedDate = ''; state.calendarMonth = currentMonthKey_(); state.dates = []; state.selectedSlot = null; $('#selected-date').hidden = true; $('#slots').innerHTML = ''; $('#confirm-reservation').disabled = true; renderCalendar(); showAlert(''); showStep(1); $('#dni').focus();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    $('#continue-dni').addEventListener('click', lookupDni);
    $('#continue-person').addEventListener('click', () => { if (validatePersonStep()) { showAlert(''); showStep(3); loadCampaigns(); } });
    $('#calendar-prev').addEventListener('click', () => changeCalendarMonth_(-1));
    $('#calendar-next').addEventListener('click', () => changeCalendarMonth_(1));
    $('#confirm-reservation').addEventListener('click', confirmReservation);
    $('#new-reservation').addEventListener('click', resetForm);
    $('#dni').addEventListener('input', () => { $('#dni').value = $('#dni').value.replace(/\D/g, '').slice(0, 8); });
    try { const config = handleResponse(await runServer('getAppConfig')); $('#company-name').textContent = config.app.company || 'Campaña de Salud'; $('#app-title').textContent = config.app.title || 'Reserva tu cita'; } catch (error) { showAlert(error.message); }
  });
</script>
